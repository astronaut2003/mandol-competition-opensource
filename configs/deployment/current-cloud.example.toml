# Reviewed mm-source-preserving-add-20261113-v3 workflow.
# scripts/start_api.py selects source fallback=1 and full database audit=0.
# Supply credentials through environment variables.
# Use fresh, isolated storage. TOML values do not expand shell variables.
[global]
runtime_root = "data"
qdrant_endpoint = "http://127.0.0.1:6333"
log_level = "INFO"

[textual]
namespace = "mandol-public-reproduction-v2"
inference_contract = "aml-official-eligible-v1"
evidence_profile = "textual-t0-observation-history-v1"
reranker_backend = "dashscope-qwen37-v1"
[textual.inference]
embedding = "http://127.0.0.1:18620"
sparse = "http://127.0.0.1:18620"
reranker = "https://cn-beijing.maas.qianwenaiapi.com/api/v1/services/rerank/text-rerank/text-rerank"

[code]
namespace = "mandol-public-reproduction-v2"
inference_contract = "aml-official-eligible-v1"
retrieval_policy = "code-native-sparse-rrf100-v1"
reranker_backend = "dashscope-qwen37-v1"
[code.inference]
embedding = "http://127.0.0.1:18620"
reranker = "https://cn-beijing.maas.qianwenaiapi.com/api/v1/services/rerank/text-rerank/text-rerank"

[multimodal]
# The public launcher selects source-grounded-recall-v4 evidence review/delivery.
namespace = "mandol-public-reproduction-v2"
inference_contract = "aml-official-eligible-v1"
retrieval_policy = "mm-qwen37-same-pool-rank-only-v1"
reranker_backend = "dashscope-qwen37-v1"
[multimodal.inference]
embedding = "http://127.0.0.1:18620"
sparse = "http://127.0.0.1:18620"
reranker = "https://cn-beijing.maas.qianwenaiapi.com/api/v1/services/rerank/text-rerank/text-rerank"
vlm = "https://vlm.example.invalid/v1"
