[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mandol-competition"
version = "0.1.0"
description = "Unified self-hosted agent memory for textual, coding and multimodal workloads"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mandol-substrate==0.1.0",
  "fastapi==0.136.3",
  "pydantic==2.13.3",
  "uvicorn==0.49.0",
  "httpx==0.28.1",
  "numpy==1.26.4",
]

[project.optional-dependencies]
textual = ["rustworkx==0.17.1"]
code = ["rustworkx==0.17.1", "networkx==3.6.1", "tree-sitter==0.25.2", "tree-sitter-language-pack==1.14.3"]
multimodal = ["pillow==12.2.0", "openai==2.32.0"]
all = ["mandol-competition[textual,code,multimodal]"]
dev = ["pytest==9.0.2"]
benchmark = ["nltk==3.9.1"]

[project.urls]
Homepage = "https://github.com/astronaut2003/mandol-competition-opensource"
Documentation = "https://github.com/astronaut2003/mandol-competition-opensource#documentation"
Issues = "https://github.com/astronaut2003/mandol-competition-opensource/issues"

[tool.uv.workspace]
members = ["packages/substrate"]

[tool.uv.sources]
mandol-substrate = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mandol_competition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["unit: isolated unit", "fault: fault injection", "integration_sqlite: real scratch SQLite", "integration_qdrant: real scratch Qdrant", "integration_vllm: real inference required"]


# Pin transitive application dependencies for reproducible installations.
[tool.uv]
constraint-dependencies = [
  "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.13.0",
  "certifi==2026.4.22",
  "click==8.3.3",
  "colorama==0.4.6",
  "distro==1.9.0",
  "fastapi==0.136.3",
  "grpcio==1.80.0",
  "h11==0.16.0",
  "h2==4.4.1",
  "hpack==4.2.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "hyperframe==6.1.0",
  "idna==3.13",
  "iniconfig==2.3.0",
  "jiter==0.14.0",
  "networkx==3.6.1",
  "numpy==1.26.4",
  "openai==2.32.0",
  "packaging==26.1",
  "pillow==12.2.0",
  "pluggy==1.6.0",
  "portalocker==3.2.0",
  "protobuf==7.34.1",
  "pydantic-core==2.46.3",
  "pydantic==2.13.3",
  "pygments==2.20.0",
  "pytest==9.0.2",
  "pywin32==312",
  "qdrant-client==1.19.0",
  "rustworkx==0.17.1",
  "sniffio==1.3.1",
  "starlette==1.3.1",
  "tqdm==4.67.3",
  "tree-sitter-language-pack==1.14.3",
  "tree-sitter==0.25.2",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
  "urllib3==2.6.3",
  "uvicorn==0.49.0",
]

[tool.setuptools.package-data]
"mandol_competition.textual" = ["profiles/source_b1_public_v1/*.json", "profiles/aml_official_v4_v1/*.json"]

"mandol_competition.multimodal" = ["profiles/*.json"]
